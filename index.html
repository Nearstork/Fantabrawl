
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantabrawl</title>
<style>
body{margin:0;background:#171529;color:white;font-family:Arial;text-align:center}
header{padding:25px;background:#292344}
h1{color:#ffd45c;font-size:38px}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:15px}
button{background:#ffd45c;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer;margin:4px}
input{padding:12px;border-radius:8px;border:0;margin:5px;max-width:85%}
section{max-width:650px;margin:15px auto;padding:20px;background:#292344;border-radius:16px}
.card{background:#393252;padding:13px;margin:10px;border-radius:12px}
.small{color:#c9c3dc;font-size:13px}
#status{color:#ffd45c}
</style>
</head>
<body>
<header>
<h1>⭐ FANTABRAWL ⭐</h1>
<p>LA TUA LEGA DI BRAWL STARS</p>
<p id="status">Connessione a Firebase...</p>
</header>

<nav>
<button onclick="show('mercato')">Mercato</button>
<button onclick="show('squadre')">Squadre</button>
<button onclick="show('classifica')">Classifica</button>
</nav>

<section>
<h2 id="titolo">Mercato Brawler</h2>
<p class="small">Lega: Fantabrawl Champions</p>
<div id="contenuto">Caricamento...</div>
</section>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {
 getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import {
 getDatabase, ref, set, onValue
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyD4ggcX5t-Ssle7y4Kxk-4WGOBwZMxATHo",
 authDomain: "fantabrawl-92103.firebaseapp.com",
 databaseURL: "https://fantabrawl-92103-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "fantabrawl-92103",
 storageBucket: "fantabrawl-92103.firebasestorage.app",
 messagingSenderId: "156509916126",
 appId: "1:156509916126:web:acf96f7f923a74fc4bab4f",
 measurementId: "G-XRYKGQ1908"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const brawlers = [
"Chester","Cordelius","Shelly","Colt","Spike",
"Leon","Crow","Edgar","Mortis","Dynamike",
"Surge","8-Bit","Poco","Kenji","Lily"
];

let uid = null;
let players = {};
let picks = {};
let current = "mercato";
let ready = false;

const box = document.getElementById("contenuto");
const statusText = document.getElementById("status");

function show(page) {
 current = page;
 document.getElementById("titolo").textContent =
 page === "mercato" ? "⭐ Mercato Brawler" :
 page === "squadre" ? "👥 Squadre" : "🏆 Classifica";
 render();
}
window.show = show;

function render() {
 box.innerHTML = "";

 if (!ready) {
  box.textContent = "Connessione in corso...";
  return;
 }

 if (current === "mercato") {
  const p = document.createElement("p");
  p.textContent = "La tua identità: " +
   (players[uid]?.name || "Non ancora registrato");
  box.appendChild(p);

  if (!players[uid]) {
   const input = document.createElement("input");
   input.id = "nome";
   input.placeholder = "Il tuo nome";
   const btn = document.createElement("button");
   btn.textContent = "Entra nella lega";
   btn.onclick = () => join(input.value);
   box.append(input, btn);
  }

  const info = document.createElement("p");
  info.className = "small";
  info.textContent = "Ogni Brawler può essere scelto una sola volta.";
  box.appendChild(info);

  brawlers.forEach(b => {
   const div = document.createElement("div");
   div.className = "card";
   const title = document.createElement("b");
   title.textContent = b;
   div.appendChild(title);
   div.appendChild(document.createElement("br"));
   div.appendChild(document.createElement("br"));

   const owner = picks[b];
   const label = document.createElement("span");
   label.textContent = owner
    ? "Scelto da " + (players[owner]?.name || "Partecipante")
    : "Disponibile";
   div.appendChild(label);

   if (!owner && players[uid]) {
    const btn = document.createElement("button");
    btn.textContent = "Scegli";
    btn.onclick = () => pick(b);
    div.appendChild(document.createElement("br"));
    div.appendChild(btn);
   }
   box.appendChild(div);
  });
 }

 if (current === "squadre") {
  const entries = Object.entries(players);
  if (!entries.length) box.textContent = "Nessuna squadra ancora.";

  entries.forEach(([id, player]) => {
   const div = document.createElement("div");
   div.className = "card";
   const name = document.createElement("b");
   name.textContent = player.name;
   div.appendChild(name);

   const names = Object.entries(picks)
    .filter(([b, owner]) => owner === id)
    .map(([b]) => b);

   const p = document.createElement("p");
   p.textContent = names.join(", ") || "Nessun Brawler";
   div.appendChild(p);
   box.appendChild(div);
  });
 }

 if (current === "classifica") {
  const entries = Object.entries(players);
  if (!entries.length) box.textContent = "Nessun partecipante.";

  entries.forEach(([id, player], i) => {
   const div = document.createElement("div");
   div.className = "card";
   div.textContent = (i + 1) + "° " + player.name + " — 0 punti";
   box.appendChild(div);
  });
 }
}

async function join(rawName) {
 const name = rawName.trim();
 if (!name) return alert("Scrivi il tuo nome!");
 if (name.length > 20) return alert("Massimo 20 caratteri!");

 if (players[uid]) return alert("Sei già nella lega!");
 if (Object.keys(players).length >= 8)
  return alert("Lega piena!");

 if (Object.values(players).some(p =>
  p.name.toLowerCase() === name.toLowerCase()
 )) return alert("Nome già presente!");

 try {
  await set(ref(db, "fantabrawl/players/" + uid), {name});
 } catch (e) {
  alert("Non è stato possibile entrare: " + e.message);
 }
}

async function pick(brawler) {
 if (!players[uid]) return alert("Prima entra nella lega!");
 if (picks[brawler]) return alert("Brawler già scelto!");

 try {
  await set(ref(db, "fantabrawl/picks/" + brawler), uid);
 } catch (e) {
  alert("Scelta non riuscita: " + e.message);
 }
}

signInAnonymously(auth).catch(e => {
 statusText.textContent = "Errore accesso: " + e.message;
});

onAuthStateChanged(auth, user => {
 if (!user) return;
 uid = user.uid;

 onValue(ref(db, "fantabrawl/players"), snap => {
  players = snap.val() || {};
  ready = true;
  statusText.textContent = "🟢 Connesso";
  render();
 }, error => {
  statusText.textContent = "Errore lettura partecipanti";
 });

 onValue(ref(db, "fantabrawl/picks"), snap => {
  picks = snap.val() || {};
  render();
 }, error => {
  statusText.textContent = "Errore lettura mercato";
 });
});
</script>
</body>
</html>
